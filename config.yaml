# =============================================================================
# config.yaml — TODA a regra de negócio do bot mora aqui.
# Você muda o comportamento do bot editando ESTE arquivo, sem mexer no Python.
# Segredos (token do Telegram, CEP, URL do calendário) NÃO ficam aqui:
# ficam nos "Secrets" do GitHub (veja docs/GUIA_PASSO_A_PASSO.md, Etapa 6).
# =============================================================================

criterios:
  marcas:                       # marca -> palavras que identificam a marca no título
    gree:  ["gree"]
    midea: ["midea", "springer midea"]
    elgin: ["elgin"]
  capacidades_btu: [9000, 12000]  # só aceita estes tamanhos
  exigir_inverter: true
  exigir_so_frio: true           # descarta "quente e frio", "q/f" etc.
  voltagem: 220                  # descarta anúncios que digam 110V/127V sem citar 220V
  preco_maximo: 2500.00          # teto SÓ do aparelho, em reais
  # Regra do 12k: seu quarto (3 m x 2,8 m = 8,4 m²) pede 9.000 BTU.
  # "somente_se_mais_barato_que_9k" -> só avisa 12k se ele custar MENOS que o melhor 9k da rodada.
  # Troque para "sempre" se quiser ver todo 12k abaixo do teto.
  regra_12k: "somente_se_mais_barato_que_9k"
  exigir_frete_gratis: true      # oferta com frete PAGO confirmado é descartada;
                                 # frete "não verificado" passa, mas com aviso ⚠️
  # Palavras que indicam peça/acessório, e não o aparelho completo
  palavras_proibidas: ["kit instalacao", "kit de instalacao", "suporte", "controle remoto",
                       "placa", "capacitor", "somente evaporadora", "somente condensadora",
                       "capa protetora", "usado", "recondicionado", "vitrine"]
  # Códigos de fábrica que indicam versão QUENTE/FRIO (a regra de texto às vezes falha)
  # GWH = Gree quente/frio | HJQ = Elgin quente/frio | EZVQ = Midea quente/frio
  codigos_quente_frio: ["gwh", "hjq", "ezvq"]

alertas:
  # "Diferença grande" entre lojas para o MESMO modelo -> Telegram 🔥 + evento no Google Agenda
  diferenca_percentual_minima: 15   # (mais caro - mais barato) / mais caro >= 15%
  diferenca_reais_minima: 250       # ...E a diferença precisa ser de pelo menos R$ 250
  # Queda em relação ao histórico da MESMA URL -> só Telegram
  queda_percentual_minima: 8
  criar_evento_agenda: true

educacao_http:                   # regras de "bom cidadão" na internet (ver docs/DECISOES.md)
  intervalo_segundos: 10         # espera mínima entre 2 requisições ao MESMO site
  timeout_segundos: 25
  max_requisicoes_por_site: 12   # teto por execução, por site
  respeitar_robots_txt: true

# Cada modelo tem códigos de fábrica. Se o título/descrição de uma oferta contiver
# QUALQUER um dos códigos, a oferta é considerada "o mesmo produto" -> permite comparar
# o preço do mesmo aparelho entre lojas diferentes (base do alerta de diferença grande).
# Escreva os códigos em minúsculas e SEM o prefixo "45" que algumas lojas colocam.
